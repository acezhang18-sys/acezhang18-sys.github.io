<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership — Ace Zhang</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-image: url("../background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      padding: 24px;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        padding: 16px;
      }
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: rgba(40, 50, 60, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 32px 40px;
    }

    .card h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      color: #e9e9e9;
      margin-bottom: 20px;
    }

    .detail-list {
      list-style: disc;
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 600;
      margin-bottom: 32px;
    }

    .detail-list li a,
    .detail-list li span {
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
    }

    .detail-list li a {
      text-decoration: underline;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .home-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="card">
      <h1>Software Development & Technical Skills</h1>
      <ul class="detail-list">
        <li><a href="development_experience/index.html">Development Experience</a></li>
        <li><a href="">Technical Problem-Solving</a></li>
        <li><a href="">Systems & Tools</a></li>
        <li><a href="">Continuous Learning</a></li>
      </ul>
      <a class="home-btn" href="../index.html">&#8962; Back To Home</a>
    </section>
  </div>
</body>
</html>
